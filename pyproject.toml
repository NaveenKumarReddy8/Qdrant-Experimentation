[project]
name = "qdrant-experimentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naveen Kumar Reddy Pemmana", email = "mr.naveen8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
]

[project.scripts]
qdrant-experimentation = "qdrant_experimentation:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.35",
]
